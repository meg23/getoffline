[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = false
strict = true

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymysql"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.views",
  "models.*",
  "workers.*",
  "tests.*",
]
ignore_errors = true
