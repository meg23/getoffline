{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to GetOffline</title>
    <link rel="stylesheet" href="{% static 'app/login.css' %}" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">GetOffline</h1>
        <p class="login-copy">Sign in with your username and password.</p>
        {% if login_error %}<p class="login-error" role="alert">Invalid username or password.</p>{% endif %}
        <form class="login-form" method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}" />
          <label for="id_username">Username</label>
          <input id="id_username" name="username" type="text" autocomplete="username" required />
          <label for="id_password">Password</label>
          <input id="id_password" name="password" type="password" autocomplete="current-password" required />
          <button class="login-submit" type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
