[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["arg-type", "assignment", "dict-item", "import-untyped", "index", "return-value", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymysql"]
ignore_missing_imports = true
