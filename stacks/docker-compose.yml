x-common-env: &common-env
  GETOFFLINE_DJANGO_DEBUG: "0"
  GETOFFLINE_DJANGO_ALLOWED_HOSTS: ${GETOFFLINE_DJANGO_ALLOWED_HOSTS:-*}
  GETOFFLINE_CSRF_TRUSTED_ORIGINS: ${GETOFFLINE_CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080}
  GETOFFLINE_DJANGO_SECRET_KEY: ${GETOFFLINE_DJANGO_SECRET_KEY:?set GETOFFLINE_DJANGO_SECRET_KEY}

x-runtime-env: &runtime-env
  <<: *common-env
  GETOFFLINE_DJANGO_ROLE: api
  GETOFFLINE_DB_HOST: ${GETOFFLINE_DB_HOST:-mysql}
  GETOFFLINE_DB_PORT: ${GETOFFLINE_DB_PORT:-3306}
  GETOFFLINE_DB_NAME: ${GETOFFLINE_DB_NAME:-getoffline}
  GETOFFLINE_DB_USER: ${GETOFFLINE_DB_USER:-getoffline}
  GETOFFLINE_DB_PASSWORD: ${GETOFFLINE_DB_PASSWORD:-getoffline}

x-frontend-env: &frontend-env
  <<: *common-env
  GETOFFLINE_API_BASE_URL: ${GETOFFLINE_API_BASE_URL:-http://api:8000/api}

x-api-env: &api-env
  <<: *runtime-env
  GETOFFLINE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
  GETOFFLINE_RABBITMQ_EXCHANGE: ${GETOFFLINE_RABBITMQ_EXCHANGE:-getoffline}
  GETOFFLINE_WORKER_API_TOKEN: ${GETOFFLINE_WORKER_API_TOKEN:-}

x-worker-env: &worker-env
  <<: *runtime-env
  GETOFFLINE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
  GETOFFLINE_RABBITMQ_EXCHANGE: ${GETOFFLINE_RABBITMQ_EXCHANGE:-getoffline}
  GETOFFLINE_YTDLP_MODULE: ${GETOFFLINE_YTDLP_MODULE:-yt_dlp}
  GETOFFLINE_CPU_SCHEDULER_SLOTS: ${GETOFFLINE_CPU_SCHEDULER_SLOTS:-3}
  GETOFFLINE_WORKER_API_URL: ${GETOFFLINE_WORKER_API_URL:-http://api:8000/api}
  GETOFFLINE_WORKER_API_TOKEN: ${GETOFFLINE_WORKER_API_TOKEN:-}
  GETOFFLINE_WORKER_MEDIA_CACHE_DIR: ${GETOFFLINE_WORKER_MEDIA_CACHE_DIR:-/tmp/getoffline-worker-media}
  # Keep workers connected long enough to drain normal queues. The application
  # default is intentionally small for one-shot test workers.
  GETOFFLINE_WORKER_MAX_MESSAGES: ${GETOFFLINE_WORKER_MAX_MESSAGES:-1000}

x-app-image: &app-image "${GETOFFLINE_IMAGE_REGISTRY:-localhost:5000}/getoffline/app:${GETOFFLINE_IMAGE_TAG:-latest}"
x-download-worker-image: &download-worker-image "${GETOFFLINE_IMAGE_REGISTRY:-localhost:5000}/getoffline/worker-download:${GETOFFLINE_IMAGE_TAG:-latest}"
x-ffmpeg-worker-image: &ffmpeg-worker-image "${GETOFFLINE_IMAGE_REGISTRY:-localhost:5000}/getoffline/worker-ffmpeg:${GETOFFLINE_IMAGE_TAG:-latest}"
x-transcript-worker-image: &transcript-worker-image "${GETOFFLINE_IMAGE_REGISTRY:-localhost:5000}/getoffline/worker-transcripts:${GETOFFLINE_IMAGE_TAG:-latest}"
x-base-worker-image: &base-worker-image "${GETOFFLINE_IMAGE_REGISTRY:-localhost:5000}/getoffline/worker-base:${GETOFFLINE_IMAGE_TAG:-latest}"

services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "${GETOFFLINE_REGISTRY_PUBLISHED_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry

  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    ports:
      - "${GETOFFLINE_RABBITMQ_PUBLISHED_PORT:-5672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${GETOFFLINE_DB_NAME:-getoffline}
      MYSQL_USER: ${GETOFFLINE_DB_USER:-getoffline}
      MYSQL_PASSWORD: ${GETOFFLINE_DB_PASSWORD:-getoffline}
      MYSQL_ROOT_PASSWORD: ${GETOFFLINE_DB_ROOT_PASSWORD:-getoffline-root}
    ports:
      - "${GETOFFLINE_DB_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: *app-image
    restart: unless-stopped
    environment: *frontend-env
    ports:
      - "${GETOFFLINE_FRONTEND_PUBLISHED_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  api:
    image: *app-image
    restart: unless-stopped
    environment: *api-env
    command: api-entrypoint.sh
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    ports:
      - "${GETOFFLINE_API_PUBLISHED_PORT:-8081}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-updates:
    image: *download-worker-image
    restart: unless-stopped
    environment: *worker-env
    command: python -m workers updates
    depends_on: &worker-depends-on
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      frontend:
        condition: service_healthy

  worker-downloader-youtube:
    image: *download-worker-image
    restart: unless-stopped
    cpus: 1.5
    environment: *worker-env
    command: python -m workers downloader-youtube
    deploy:
      replicas: 2
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    depends_on: *worker-depends-on

  worker-downloader-podcast:
    image: *download-worker-image
    restart: unless-stopped
    environment: *worker-env
    command: python -m workers downloader-podcast
    deploy:
      replicas: 2
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    depends_on: *worker-depends-on

  worker-ffmpeg:
    image: *ffmpeg-worker-image
    restart: unless-stopped
    cpus: 1.0
    environment: *worker-env
    command: python -m workers ffmpeg
    deploy:
      replicas: 3
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    depends_on: *worker-depends-on

  worker-transcripts:
    image: *transcript-worker-image
    restart: unless-stopped
    cpus: 1.0
    environment: *worker-env
    command: sh -c "python -m workers transcripts --prefetch $${PREFETCH:-1}"
    deploy:
      replicas: 3
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    depends_on: *worker-depends-on

  scheduler:
    image: *app-image
    restart: unless-stopped
    environment: *worker-env
    command: python -m django run_scheduler --loop --install-defaults
    depends_on: *worker-depends-on

  worker-cleanup:
    image: *base-worker-image
    restart: unless-stopped
    environment: *worker-env
    command: python -m workers cleanup
    volumes:
      - ${GETOFFLINE_DOWNLOADS_DIR:-./downloads}:/app/downloads
    depends_on: *worker-depends-on

volumes:
  mysql-data:
    name: ${GETOFFLINE_MYSQL_VOLUME_NAME:-getoffline_mysql-data}
  rabbitmq-data:
    name: ${GETOFFLINE_RABBITMQ_VOLUME_NAME:-getoffline_rabbitmq-data}
  registry-data:
    name: ${GETOFFLINE_REGISTRY_VOLUME_NAME:-getoffline_registry-data}
