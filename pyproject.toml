[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = false
strict = true

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymysql"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.views",
  "models.*",
  "workers.*",
  "tests.*",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
  "B404", # Subprocess imports are required for controlled ffmpeg/ffprobe invocations.
  "B603", # Commands use argument lists with shell disabled.
  "B607", # The runtime environment supplies ffmpeg/ffprobe via PATH.
]

[tool.ruff.lint.mccabe]
max-complexity = 60
