name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: getoffline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt

      - name: Compile Python files
        run: python -m py_compile $(git ls-files '*.py')

  ruff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt ruff

      - name: Run Ruff linting
        run: ruff check src tests crons

  mccabe:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt mccabe

      - name: Run McCabe complexity checks
        run: |
          output="$(python -m mccabe --min 61 $(git ls-files '*.py'))"
          if [ -n "$output" ]; then
            echo "$output"
            echo "McCabe complexity exceeds 60."
            exit 1
          fi

  mypy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt mypy

      - name: Run mypy static type checks
        env:
          PYTHONPATH: src
        run: mypy --strict src tests

  vulture:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt vulture

      - name: Run Vulture dead-code analysis
        run: vulture src tests --min-confidence 100

  bandit:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt bandit

      - name: Run Bandit security checks
        run: bandit -c pyproject.toml -r src

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r src/requirements.txt coverage

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
          GETOFFLINE_DB_ENGINE: sqlite
          GETOFFLINE_DB_NAME: ":memory:"
          GETOFFLINE_MODEL_CACHE_DIR: ${{ runner.temp }}/getoffline-model-cache
        run: |
          coverage run --source=src -m unittest discover -s tests -p 'test_*.py' -v
          coverage report --show-missing

  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs:
      - compile
      - ruff
      - mccabe
      - mypy
      - bandit
      - vulture
      - coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests
        run: make integration-test
