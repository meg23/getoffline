[tool.ruff.lint]
extend-select = [
    "I",
    "PIE810",
    "PLR0402",
    "TRY401",
    "RUF013",
    "RUF046",
    "RUF100",
    "B010",
    "BLE001",
    "EXE001",
    "PLR1730",
    "PYI034",
    "PYI041",
    "SIM103",
    "SIM117",
    "UP012",
    "UP037",
    "RUF012",
]
extend-ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/models/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
exclude = ["^src/cli/"]
ignore_missing_imports = true
no_implicit_optional = false
strict = true

[[tool.mypy.overrides]]
module = ["pymysql.*", "pymysql"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "frontend.middleware",
  "frontend.views",
  "models.*",
  "workers.*",
  "tests.*",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
  "B404", # Subprocess imports are required for controlled ffmpeg/ffprobe invocations.
  "B603", # Commands use argument lists with shell disabled.
  "B607", # The runtime environment supplies ffmpeg/ffprobe via PATH.
]
