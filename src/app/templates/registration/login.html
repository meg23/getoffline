{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to GetOffline</title>
    <link rel="stylesheet" href="{% static 'app/dashboard.css' %}" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">GetOffline</h1>
        <p>Sign in with a command-line-created user.</p>
        {% if form.errors %}<p class="login-error">Invalid username or password.</p>{% endif %}
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}" />
          <label for="id_username">Username</label>
          {{ form.username }}
          <label for="id_password">Password</label>
          {{ form.password }}
          <button class="primary" type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
